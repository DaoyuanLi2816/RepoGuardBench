name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests (no GPU / no network)
        run: python -m pytest -q
      - name: No-GPU smoke (deterministic mock backend)
        run: python scripts/smoke.py
      - name: Reproduce tables from bundled aggregates
        run: python scripts/make_tables.py --agg results/aggregate --out reproduced/tables
      - name: Verify paper claims from bundled results
        run: python scripts/verify_paper_claims.py
      - name: Release scan (secrets / paths / weights)
        run: python scripts/check_release.py .
